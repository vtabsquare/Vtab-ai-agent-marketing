services:
  - type: web
    name: vtab-ai-agent-marketing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MARKETING_MODE
        value: local
      - key: MARKETING_DATA_DIR
        value: ./data
      - key: MARKETING_ALLOWED_HOSTS
        value: "*"
